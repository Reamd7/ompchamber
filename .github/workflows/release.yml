name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get version
        id: get_version
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ -n "$RELEASE_INPUT_VERSION" ]]; then
            echo "version=$RELEASE_INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version matches package manifests
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          for pkg in package.json packages/electron/package.json packages/web/package.json; do
            APP_VERSION=$(node -p "require('./$pkg').version")
            if [ "$APP_VERSION" != "$VERSION" ]; then
              echo "::error::Release version $VERSION does not match $pkg version $APP_VERSION. Bump the package version before tagging."
              exit 1
            fi
          done

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: true
          name: OMPChamber v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-cli:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web package
        working-directory: packages/web
        run: bun run build

      - name: Pack CLI tarball
        working-directory: packages/web
        run: npm pack

      - name: Smoke test — install tarball and boot server + engine
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL="$GITHUB_WORKSPACE/packages/web/ompchamber-${VERSION}.tgz"
          PREFIX="$RUNNER_TEMP/cli-smoke"
          npm install -g --prefix "$PREFIX" "$TARBALL"
          export PATH="$PREFIX/bin:$PATH"
          ompchamber --version

          # Server smoke: boot serve and wait for /health.
          (ompchamber serve --port 3939 --foreground > "$RUNNER_TEMP/serve.log" 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://127.0.0.1:3939/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf --max-time 2 http://127.0.0.1:3939/health
          ompchamber stop --port 3939 || true

          # Engine smoke on a clean machine: stage the pi_natives addon from
          # the installed optional dependency, then boot the omp host from
          # source under bun exactly as the server would.
          rm -rf "$HOME/.omp/natives"
          node -e "import('$PREFIX/lib/node_modules/ompchamber/server/lib/opencode/omp-host-natives.js').then((m) => m.ensureOmpHostNatives())"
          ls "$HOME"/.omp/natives/*/pi_natives.linux-x64-*.node
          (bun "$PREFIX/lib/node_modules/ompchamber/server/lib/omp-host/host.js" serve --hostname 127.0.0.1 --port 3941 > "$RUNNER_TEMP/host.log" 2>&1 &)
          for i in $(seq 1 20); do
            if curl -sf --max-time 2 http://127.0.0.1:3941/global/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf --max-time 2 http://127.0.0.1:3941/global/health
          pkill -f 'omp-host/host.js serve' || true
          echo "--- serve.log ---"; head -20 "$RUNNER_TEMP/serve.log"

      - name: Stage latest alias
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: cp "packages/web/ompchamber-${VERSION}.tgz" packages/web/ompchamber-latest.tgz

      - name: Upload CLI tarballs to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            packages/web/ompchamber-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-electron-macos:
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            platform: darwin-aarch64
            runner: macos-26
          - target: x86_64-apple-darwin
            arch: x64
            platform: darwin-x86_64
            runner: macos-15-intel
    env:
      # When both secrets exist the build signs + notarizes; otherwise it
      # falls back to an unsigned build (macOS in-app updates then require a
      # signed release, see packages/electron/README.md).
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled omp host version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@oh-my-pi/pi-coding-agent']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled omp host artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/omp-host
          key: omp-host-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            omp-host-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install Apple Certificate
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/electron-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build Electron app
        working-directory: packages/electron
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # rebuild-native.mjs reads this to target the right arch when
          # cross-building (runner is arm64; x64 matrix needs the hint).
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: |
          bun run build:web-assets
          bun run prepare:omp-host
          bun run verify:omp-host
          bun run bundle:main
          # npmRebuild=false in package.json, so electron-builder won't
          # recompile native deps on its own — we must rebuild against the
          # target Electron ABI before packaging, otherwise node-pty/bun-pty
          # crash on require inside the packaged app.
          bun run rebuild:native
          if [ "${HAS_APPLE_SIGNING}" = "true" ]; then
            bunx electron-builder --mac --${{ matrix.arch }} --publish=never
          else
            echo "[electron] Apple signing secrets not set; building unsigned (no notarization)."
            CSC_IDENTITY_AUTO_DISCOVERY=false \
              bunx electron-builder --mac --${{ matrix.arch }} --publish=never -c.mac.notarize=false
          fi
          bun run verify:omp-host:packaged

      - name: Verify signature + entitlements + notarization
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          set -euo pipefail

          APP_DIR="packages/electron/dist/mac"
          [ -d "packages/electron/dist/mac-arm64" ] && APP_DIR="packages/electron/dist/mac-arm64"

          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found under packages/electron/dist/mac*"
            ls -la packages/electron/dist/
            exit 1
          fi

          echo "Verifying $APP_PATH"
          codesign -vv --deep --strict "$APP_PATH"

          # Require hardened runtime
          CS_INFO=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          echo "$CS_INFO"
          if ! echo "$CS_INFO" | grep -q "flags=.*runtime"; then
            echo "Error: hardened runtime flag missing"
            exit 1
          fi

          # Require notary ticket stapled
          xcrun stapler validate "$APP_PATH"

          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>&1 || true)
          if echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"; then
            echo "Error: app sandbox entitlement is present"
            exit 1
          fi
          for key in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-library-validation
          do
            if ! echo "$ENTITLEMENTS" | grep -q "<key>$key</key>"; then
              echo "Error: required entitlement missing: $key"
              exit 1
            fi
          done

      - name: Upload DMG / ZIP / blockmaps to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-arch latest-mac.yml for merge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest-mac.yml
          retention-days: 1

  build-desktop-electron-windows:
    needs: create-release
    # windows-latest currently resolves to a runner with Visual Studio 18,
    # which this electron/node-gyp stack does not detect correctly.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            platform: win32-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled omp host version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@oh-my-pi/pi-coding-agent']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled omp host artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/omp-host
          key: omp-host-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            omp-host-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled omp host
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:omp-host
          bun run verify:omp-host

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          # Cross-compile for ARM64 target from x64 runner.
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        # npmRebuild=false in package.json, so electron-builder won't
        # recompile native deps on its own — we must rebuild against the
        # target Electron ABI before packaging.
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:omp-host:packaged

      - name: Upload installer to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update manifest as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest.yml
          retention-days: 1

  build-desktop-electron-linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            manifest: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            host_arch: aarch64
            artifact_arch: arm64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$OPENCHAMBER_TARGET_ARCH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled omp host version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@oh-my-pi/pi-coding-agent']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled omp host artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/omp-host
          key: omp-host-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            omp-host-${{ runner.os }}-${{ matrix.arch }}-

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Build and package Linux AppImage
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:omp-host
          bun run verify:omp-host
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:omp-host:packaged
          bun run verify:linux-appimage

      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          APPIMAGE="dist/OMPChamber-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$APPIMAGE" "$VERSION"

      - name: Upload validated Linux release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ matrix.arch }}
          path: |
            packages/electron/dist/OMPChamber-${{ needs.create-release.outputs.version }}-linux-${{ matrix.artifact_arch }}.AppImage
            packages/electron/dist/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 1

  publish-electron-linux:
    needs: [create-release, build-desktop-electron-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download x64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-x64
          path: artifacts/x64

      - name: Download arm64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-arm64
          path: artifacts/arm64

      - name: Revalidate separate Linux manifests
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/x64/latest-linux.yml \
            "artifacts/x64/OMPChamber-${VERSION}-linux-x86_64.AppImage" \
            "$VERSION"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/arm64/latest-linux-arm64.yml \
            "artifacts/arm64/OMPChamber-${VERSION}-linux-arm64.AppImage" \
            "$VERSION"

      - name: Upload Linux AppImages and manifests to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            artifacts/x64/OMPChamber-${{ needs.create-release.outputs.version }}-linux-x86_64.AppImage
            artifacts/x64/latest-linux.yml
            artifacts/arm64/OMPChamber-${{ needs.create-release.outputs.version }}-linux-arm64.AppImage
            artifacts/arm64/latest-linux-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  combine-electron-manifests:
    needs: [create-release, build-desktop-electron-macos, build-desktop-electron-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Download per-arch update manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: artifacts

      - name: Finalize combined manifests
        env:
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          OPENCHAMBER_VERSION: ${{ needs.create-release.outputs.version }}
        run: node packages/electron/scripts/finalize-latest-yml.mjs

      - name: Upload combined manifests to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            ${{ runner.temp }}/latest-mac.yml
            ${{ runner.temp }}/latest.yml
            ${{ runner.temp }}/latest-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [create-release, package-cli, build-desktop-electron-macos, build-desktop-electron-windows, build-desktop-electron-linux, publish-electron-linux, combine-electron-manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify final Linux release asset inventory
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node - <<'NODE'
          (async () => {
          const { REPOSITORY: repo, VERSION: version, GITHUB_TOKEN: token } = process.env;
          const expected = [
            `ompchamber-${version}.tgz`,
            'ompchamber-latest.tgz',
            `OMPChamber-${version}-linux-x86_64.AppImage`,
            'latest-linux.yml',
            `OMPChamber-${version}-linux-arm64.AppImage`,
            'latest-linux-arm64.yml',
          ];
          // The tag->release lookup can 404 briefly right after publish
          // (token-scoped cache race); retry before failing.
          let release = null;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            const response = await fetch(`https://api.github.com/repos/${repo}/releases/tags/v${version}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
            });
            if (response.ok) { release = await response.json(); break; }
            if (attempt === 5) throw new Error(`Failed to inspect release assets: ${response.status} ${await response.text()}`);
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          for (const name of expected) {
            const matches = release.assets.filter((asset) => asset.name === name);
            if (matches.length !== 1) throw new Error(`Expected exactly one ${name} release asset, found ${matches.length}`);
            if (!Number.isSafeInteger(matches[0].size) || matches[0].size <= 0) {
              throw new Error(`Release asset ${name} has invalid size ${matches[0].size}`);
            }
          }
          console.log(`Verified ${expected.length} Linux release assets and both architecture manifests.`);
          })().catch((error) => {
          console.error(error);
          process.exit(1);
          });
          NODE

      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

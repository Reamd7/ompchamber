  <!-- Right leg -->
  <rect x="75" y="20" width="12" height="45" rx="2" fill="#73C991"/>
  <!-- Plugin connector -->
  <rect x="71" y="55" width="20" height="16" rx="3" fill="#f97316"/>
  <!-- Decorative dots -->
  <circle cx="18" cy="14" r="2" fill="#f97316" opacity="0.8"/>
  <circle cx="102" cy="14" r="2" fill="#f97316" opacity="0.8"/></g>

<svg width="24" height="24" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- OpenChamber logo - simplified for VSCode activity bar -->
  <g transform="translate(16, 16) scale(0.48)">
    <!-- Left face - no fill -->
    <path d="M0 0 L-26 -15 L-26 15 L0 30 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right face - no fill -->
    <path d="M0 0 L26 -15 L26 15 L0 30 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <!-- Top face - open -->
    <path d="M0 -30 L-26 -15 L0 0 L26 -15 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <!-- Oh my Pi mark on top face: π with plugin connector (monochrome for theming) -->
    <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, -15)">
      <path d="M-9.4 -5.8 H9.4" stroke="currentColor" stroke-width="3"/>
      <path d="M-5.4 -3.9 V6.9" stroke="currentColor" stroke-width="2.8"/>
      <path d="M4.1 -3.9 V3.8" stroke="currentColor" stroke-width="2.8"/>
      <rect x="2.1" y="1.9" width="3.7" height="2.8" rx="0.6" fill="currentColor"/>
    </g>
  </g>
</svg>

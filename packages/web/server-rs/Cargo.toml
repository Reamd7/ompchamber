[package]
name = "ompchamber-server"
version = "0.1.0"
edition = "2024"
description = "Rust port of the OpenChamber web server (packages/web/server), excluding lib/omp-host"
license = "MIT"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "query", "ws"] }
base64 = "0.22"
futures = "0.3"
hkdf = "0.12"
jsonc-parser = { version = "0.26", features = ["serde"] }
once_cell = "1"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "jwk"] }
portable-pty = "0.8"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
vt100 = "0.15"

[profile.release]
lto = "thin"

<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { color: #111111; }
    @media (prefers-color-scheme: dark) { :root { color: #f5f5f5; } }
  </style>
  <!-- Oh My Pi mark - simplified for favicon -->
